<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Sistem Laporan Atensi</title>

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- SWEET ALERT -->
    <link rel="stylesheet" href="sweetalert2.min.css" />
    <script src="sweetalert2.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f9;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #566a7f;
      }

      .login-wrapper {
        width: 100%;
        max-width: 420px;
      }

      .login-card {
        background: white;
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 8px 30px rgba(67, 89, 113, 0.12);
      }

      .logo-box {
        width: 80px;
        height: 80px;
        background: rgba(105, 108, 255, 0.15);
        color: #696cff;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        margin-bottom: 25px;
        font-size: 34px;
      }

      .title {
        text-align: center;
        margin-bottom: 10px;
        font-size: 28px;
        color: #566a7f;
        font-weight: bold;
      }

      .subtitle {
        text-align: center;
        color: #a1acb8;
        margin-bottom: 30px;
        line-height: 1.5;
        font-size: 14px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #566a7f;
      }

      .input-box {
        position: relative;
      }

      .input-box i {
        position: absolute;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        color: #a1acb8;
      }

      .input-box input {
        width: 100%;
        padding: 14px 14px 14px 45px;
        border: 1px solid #d9dee3;
        border-radius: 14px;
        outline: none;
        font-size: 14px;
        transition: 0.3s;
      }

      .input-box input:focus {
        border-color: #696cff;
        box-shadow: 0 0 0 4px rgba(105, 108, 255, 0.15);
      }

      .btn-login {
        width: 100%;
        border: none;
        background: #696cff;
        color: white;
        padding: 15px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        transition: 0.3s;
        margin-top: 10px;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(105, 108, 255, 0.25);
      }

      .footer {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #a1acb8;
      }

      .footer strong {
        color: #696cff;
      }

      @media (max-width: 500px) {
        .login-card {
          padding: 25px;
          border-radius: 20px;
        }

        .title {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <div class="logo-box">
          <i class="fa-solid fa-chart-column"></i>
        </div>

        <div class="title">Sistem Laporan Atensi</div>

        <div class="subtitle">
          Silakan login untuk mengakses dashboard monitoring laporan atensi
          harian.
        </div>

        <!-- FORM -->
        <form
          onsubmit="
            login();
            return false;
          "
        >
          <div class="input-group">
            <label>Username</label>

            <div class="input-box">
              <i class="fa-solid fa-user"></i>

              <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                required
              />
            </div>
          </div>

          <div class="input-group">
            <label>Password</label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i>
            Masuk
          </button>
        </form>

        <div class="footer">
          © 2026 <strong>Sistem Laporan Atensi Harian</strong>
        </div>
      </div>
    </div>

    <script>
      function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        fetch("/api/login", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            username: username,
            password: password,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.token) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("role", data.user.role);
              localStorage.setItem("nama", data.user.nama);

              Swal.fire({
                icon: "success",
                title: "Login Berhasil",
                text: "Selamat datang kembali",
                timer: 1500,
                showConfirmButton: false,
              });

              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 1500);
            } else {
              Swal.fire({
                icon: "error",
                title: "Login Gagal",
                text: "Username atau password salah",
              });
            }
          })
          .catch(() => {
            Swal.fire({
              icon: "error",
              title: "Terjadi Kesalahan",
              text: "Server tidak dapat dihubungi",
            });
          });
      }

      // AUTO REDIRECT JIKA SUDAH LOGIN
      if (localStorage.getItem("token")) {
        window.location.href = "dashboard.html";
      }
    </script>
  </body>
</html>
