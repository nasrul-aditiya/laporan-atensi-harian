<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Buat Laporan</title>

    <!-- SweetAlert -->
    <link rel="stylesheet" href="sweetalert2.min.css" />
    <script src="sweetalert2.min.js"></script>

    <!-- Auth -->
    <script src="auth.js"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <script>
      cekLogin();
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f9;
        display: flex;
        color: #566a7f;
        overflow-x: hidden;
      }

      /* ================= OVERLAY ================= */

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 998;
        display: none;
      }

      .overlay.show {
        display: block;
      }

      /* ================= SIDEBAR ================= */

      .sidebar {
        width: 260px;
        height: 100vh;
        background: white;
        padding: 20px;
        position: fixed;
        left: 0;
        top: 0;
        border-right: 1px solid #ebeef0;
        overflow-y: auto;
        z-index: 999;
        transition: 0.3s;
      }

      .sidebar.show {
        left: 0;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .logo img {
        width: 45px;
        height: 45px;
        object-fit: contain;
      }

      .logo h3 {
        font-size: 22px;
        color: #566a7f;
      }

      .menu-title {
        font-size: 12px;
        color: #a1acb8;
        margin: 25px 0 10px;
        text-transform: uppercase;
      }

      .menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        text-decoration: none;
        color: #697a8d;
        border-radius: 12px;
        margin-bottom: 8px;
        transition: 0.3s;
      }

      .menu a:hover,
      .menu a.active {
        background: rgba(105, 108, 255, 0.16);
        color: #696cff;
      }

      /* ================= MAIN ================= */

      .main {
        margin-left: 260px;
        width: calc(100% - 260px);
        padding: 20px;
        transition: 0.3s;
      }

      /* ================= TOPBAR ================= */

      .topbar {
        background: white;
        border-radius: 16px;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
      }

      .top-left {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .page-title h2 {
        color: #566a7f;
        margin-bottom: 5px;
      }

      .page-title p {
        color: #a1acb8;
        font-size: 14px;
      }

      /* ================= HAMBURGER ================= */

      .hamburger {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 10px;
        background: #f5f5f9;
        color: #566a7f;
        cursor: pointer;
        font-size: 18px;
        display: none;
        transition: 0.3s;
      }

      .hamburger:hover {
        background: rgba(105, 108, 255, 0.15);
        color: #696cff;
      }

      .top-icons {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
      }

      /* ================= PROFILE MENU ================= */

      .profile-menu {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        width: 240px;
        overflow: hidden;
        display: none;
        z-index: 999;
        border: 1px solid #ebeef0;
      }

      .profile-menu.active {
        display: block;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        border-bottom: 1px solid #ebeef0;
      }

      .profile-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        position: relative;
      }

      .profile-avatar::after {
        content: "";
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 12px;
        height: 12px;
        background: #28c76f;
        border: 2px solid white;
        border-radius: 50%;
      }

      .profile-info h4 {
        color: #566a7f;
        font-size: 16px;
      }

      .profile-info p {
        margin-top: 4px;
        color: #a1acb8;
        font-size: 14px;
      }

      .profile-menu-content {
        padding: 12px;
      }

      .profile-menu button {
        width: 100%;
        border: none;
        background: transparent;
        color: #566a7f;
        padding: 14px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        transition: 0.3s;
      }

      .profile-menu button:hover {
        background: #f5f5f9;
        color: #ea5455;
      }

      /* ================= CARD ================= */

      .card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-top: 25px;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
      }

      .card-title {
        margin-bottom: 25px;
      }

      .card-title h3 {
        color: #566a7f;
        margin-bottom: 8px;
      }

      .card-title p {
        color: #a1acb8;
        font-size: 14px;
      }

      /* ================= FORM ================= */

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #566a7f;
      }

      .input-box {
        position: relative;
      }

      .input-box i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #a1acb8;
      }

      .input-box input,
      .input-box select {
        width: 100%;
        padding: 14px 14px 14px 45px;
        border: 1px solid #d9dee3;
        border-radius: 12px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
      }

      .input-box input:focus,
      .input-box select:focus,
      textarea:focus {
        border-color: #696cff;
        box-shadow: 0 0 0 3px rgba(105, 108, 255, 0.15);
      }

      /* ================= POSTING CARD ================= */

      .posting-card {
        background: #f8f8fc;
        border: 1px solid #ebeef5;
        border-radius: 18px;
        padding: 25px;
        margin-top: 20px;
      }

      .posting-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        color: #696cff;
        font-weight: bold;
        font-size: 18px;
      }

      .platform-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .platform-item {
        background: white;
        border-radius: 14px;
        padding: 18px;
        border: 1px solid #ebeef0;
      }

      .platform-item label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
        font-weight: bold;
        color: #566a7f;
      }

      .platform-item input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      .platform-item input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #d9dee3;
        outline: none;
      }

      .platform-item input[type="text"]:disabled {
        background: #f1f3f5;
        color: #a1acb8;
        cursor: not-allowed;
      }

      /* ================= BUTTON ================= */

      .btn-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 25px;
      }

      .btn {
        border: none;
        padding: 14px 22px;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-green {
        background: #28c76f;
      }

      .btn-blue {
        background: #696cff;
      }

      .btn-orange {
        background: #ff9f43;
      }

      /* ================= TEXTAREA ================= */

      textarea {
        width: 100%;
        min-height: 450px;
        margin-top: 25px;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid #d9dee3;
        outline: none;
        resize: vertical;
        font-family: Consolas, monospace;
        line-height: 1.8;
        font-size: 14px;
        color: #566a7f;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 900px) {
        .hamburger {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .sidebar {
          left: -260px;
        }

        .sidebar.show {
          left: 0;
        }

        .main {
          margin-left: 0;
          width: 100%;
        }

        .btn-group {
          flex-direction: column;
        }

        .btn {
          width: 100%;
          justify-content: center;
        }

        .card {
          padding: 20px;
        }
      }

      @media (max-width: 600px) {
        .main {
          padding: 15px;
        }

        .topbar {
          padding: 15px;
          flex-wrap: wrap;
        }

        .page-title h2 {
          font-size: 20px;
        }

        .page-title p {
          font-size: 13px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .platform-grid {
          grid-template-columns: 1fr;
        }

        .posting-card {
          padding: 18px;
        }

        textarea {
          min-height: 350px;
          font-size: 13px;
        }

        .card {
          padding: 18px;
        }

        .input-box input,
        .input-box select {
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= OVERLAY ================= -->

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="logo.png" alt="Logo" />

        <h3>Laporan Atensi Harian</h3>
      </div>

      <div class="menu">
        <a href="dashboard.html">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <div class="menu-title">Management</div>

        <a href="index.html" class="active">
          <i class="fa-solid fa-file-pen"></i>
          Buat Laporan
        </a>

        <!-- KHUSUS ADMIN -->
        <a href="user.html" class="admin-only">
          <i class="fa-solid fa-users"></i>
          Manajemen User
        </a>

        <a href="laporan.html">
          <i class="fa-solid fa-chart-column"></i>
          Manajemen Laporan
        </a>

        <a href="tambah-user.html" class="admin-only">
          <i class="fa-solid fa-user-plus"></i>
          Tambah User
        </a>

        <div class="menu-title">System</div>

        <a href="#" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->

    <main class="main">
      <!-- ================= TOPBAR ================= -->

      <div class="topbar">
        <div class="top-left">
          <!-- HAMBURGER -->
          <button class="hamburger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>

        <div class="top-icons">
          <div style="position: relative">
            <div class="avatar" id="avatarUser" onclick="toggleProfileMenu()">
              A
            </div>

            <div class="profile-menu" id="profileMenu">
              <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">A</div>

                <div class="profile-info">
                  <h4 id="profileName">User</h4>
                  <p id="profileRole">User</p>
                </div>
              </div>

              <div class="profile-menu-content">
                <button onclick="logout()">
                  <i class="fa-solid fa-power-off"></i>
                  Log Out
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= FORM ================= -->

      <div class="card">
        <div class="card-title">
          <h3>Form Laporan Atensi</h3>
          <p>Silakan isi data laporan kegiatan harian.</p>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Tanggal Kegiatan</label>

            <div class="input-box">
              <i class="fa-solid fa-calendar-days"></i>
              <input type="date" id="tanggal" />
            </div>
          </div>

          <div class="form-group">
            <label>Jumlah Postingan</label>

            <div class="input-box">
              <i class="fa-solid fa-layer-group"></i>

              <select id="jumlah" onchange="buatInputPostingan()">
                <option value="1">1 Postingan</option>
                <option value="2">2 Postingan</option>
                <option value="3">3 Postingan</option>
                <option value="4">4 Postingan</option>
              </select>
            </div>
          </div>
        </div>

        <div id="postingContainer"></div>

        <div class="btn-group">
          <button class="btn btn-green" onclick="buatLaporan()">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            Buat Laporan
          </button>

          <button class="btn btn-blue" onclick="copyLaporan()">
            <i class="fa-solid fa-copy"></i>
            Copy Laporan
          </button>

          <button class="btn btn-orange" onclick="simpanLaporan()">
            <i class="fa-solid fa-floppy-disk"></i>
            Simpan Laporan
          </button>
        </div>

        <textarea
          id="hasil"
          placeholder="Hasil laporan akan muncul di sini..."
        ></textarea>
      </div>
    </main>

    <script src="script.js"></script>

    <script>
      // ================= SIDEBAR =================

      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("show");

        document.getElementById("overlay").classList.toggle("show");
      }

      // otomatis tutup sidebar saat klik menu di mobile
      document.querySelectorAll(".menu a").forEach((menu) => {
        menu.addEventListener("click", () => {
          if (
            window.innerWidth <= 900 &&
            !menu.getAttribute("onclick")?.includes("logout")
          ) {
            document.getElementById("sidebar").classList.remove("show");
            document.getElementById("overlay").classList.remove("show");
          }
        });
      });

      // ================= USER PROFILE =================

      function tampilkanUser() {
        const nama = localStorage.getItem("nama") || "User";

        const role = localStorage.getItem("role") || "user";

        const inisial = nama.charAt(0).toUpperCase();

        document.getElementById("avatarUser").innerText = inisial;

        document.getElementById("profileAvatar").innerText = inisial;

        document.getElementById("profileName").innerText = nama;

        document.getElementById("profileRole").innerText = role;
      }

      function toggleProfileMenu() {
        document.getElementById("profileMenu").classList.toggle("active");
      }

      window.addEventListener("click", function (e) {
        const avatar = document.getElementById("avatarUser");

        const menu = document.getElementById("profileMenu");

        if (!avatar.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove("active");
        }
      });

      tampilkanUser();

      function aturMenuByRole() {
        const role = localStorage.getItem("role");

        if (role !== "admin") {
          document.querySelectorAll(".admin-only").forEach((item) => {
            item.style.display = "none";
          });
        }
      }

      aturMenuByRole();
    </script>
  </body>
</html>
