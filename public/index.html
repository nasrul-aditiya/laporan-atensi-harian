<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Laporan Atensi Pimpinan</title>
    <link rel="stylesheet" href="sweetalert2.min.css" />
    <script src="sweetalert2.min.js"></script>
    <script src="auth.js"></script>
    <script>
      cekLogin();
    </script>
  </head>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    /* HEADER SAMA SEPERTI DASHBOARD */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h3 {
      margin: 0;
    }

    /* BUTTON GLOBAL */
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      margin-left: 5px;
    }

    .btn-green {
      background: #2ecc71;
    }
    .btn-blue {
      background: #3498db;
    }
    .logout {
      background: red;
    }

    button:hover {
      opacity: 0.9;
    }

    /* CONTAINER */
    .container {
      max-width: 950px;
      margin: auto;
    }

    /* CARD SAMA DENGAN DASHBOARD */
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }

    /* INPUT */
    input[type="date"],
    select,
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    textarea {
      width: 100%;
      min-height: 350px; /* sebelumnya kecil */
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;

      font-family: monospace; /* biar rapi seperti dokumen */
      line-height: 1.5; /* jarak antar baris */
      white-space: pre-wrap; /* menjaga format enter */
      resize: vertical; /* bisa tarik ke bawah */
    }

    /* FIELDSET */
    fieldset {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      background: #fafafa;
    }
  </style>

  <body>
    <div class="container">
      <div class="header">
        <div>
          <h3>📄 Form Laporan</h3>
          <small id="salamUser" style="color: #555"></small>
        </div>

        <div>
          <button class="btn logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="card">
        <label>Tanggal Kegiatan</label>
        <input type="date" id="tanggal" />

        <br /><br />

        <label>Jumlah Postingan</label>
        <select id="jumlah" onchange="buatInputPostingan()">
          <option value="1">1 Postingan</option>
          <option value="2">2 Postingan</option>
          <option value="3">3 Postingan</option>
          <option value="4">4 Postingan</option>
        </select>
      </div>

      <div id="postingContainer"></div>

      <div class="card">
        <button class="btn btn-green" onclick="buatLaporan()">
          Buat Laporan
        </button>
        <button class="btn btn-blue" onclick="copyLaporan()">📋 Copy</button>
        <button class="btn btn-blue" onclick="simpanLaporan()">
          💾 Simpan
        </button>

        <textarea id="hasil"></textarea>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      function getSalam() {
        const jam = new Date().getHours();

        if (jam >= 4 && jam < 11) return "Selamat Pagi";
        if (jam >= 11 && jam < 15) return "Selamat Siang";
        if (jam >= 15 && jam < 18) return "Selamat Sore";
        return "Selamat Malam";
      }

      function tampilkanUser() {
        const nama = localStorage.getItem("nama") || "User";
        const salam = getSalam();

        document.getElementById("salamUser").innerText = `${salam}, ${nama} 👋`;
      }

      // jalankan saat halaman load
      tampilkanUser();
    </script>
  </body>
</html>
