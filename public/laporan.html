<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manajemen Laporan</title>

    <!-- AUTH -->
    <script src="auth.js"></script>

    <!-- SWEETALERT -->
    <link rel="stylesheet" href="sweetalert2.min.css" />
    <script src="sweetalert2.min.js"></script>

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f9;
        color: #566a7f;
      }

      /* ================= SIDEBAR ================= */

      .sidebar {
        width: 260px;
        height: 100vh;
        background: white;
        padding: 20px;
        position: fixed;
        left: 0;
        top: 0;
        border-right: 1px solid #ebeef0;
        transition: 0.3s;
        z-index: 1000;
        overflow-y: auto;
      }

      .sidebar.active {
        left: 0;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .logo img {
        width: 45px;
        height: 45px;
        object-fit: contain;
      }

      .logo h3 {
        font-size: 22px;
        color: #566a7f;
      }

      .menu-title {
        font-size: 12px;
        color: #a1acb8;
        margin: 25px 0 10px;
        text-transform: uppercase;
      }

      .menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        text-decoration: none;
        color: #697a8d;
        border-radius: 12px;
        margin-bottom: 8px;
        transition: 0.3s;
      }

      .menu a:hover,
      .menu a.active {
        background: rgba(105, 108, 255, 0.16);
        color: #696cff;
      }

      /* ================= OVERLAY ================= */

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 999;
        display: none;
      }

      .overlay.active {
        display: block;
      }

      /* ================= MAIN ================= */

      .main {
        margin-left: 260px;
        width: calc(100% - 260px);
        padding: 20px;
        transition: 0.3s;
      }

      /* ================= TOPBAR ================= */

      .topbar {
        background: white;
        border-radius: 16px;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
        margin-bottom: 25px;
      }

      .top-left {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .hamburger {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #f5f5f9;
        color: #566a7f;
        border: none;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
      }

      /* ================= PROFILE MENU ================= */

      .profile-menu {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        width: 240px;
        overflow: hidden;
        display: none;
        z-index: 999;
        border: 1px solid #ebeef0;
      }

      .profile-menu.active {
        display: block;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        border-bottom: 1px solid #ebeef0;
      }

      .profile-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        position: relative;
      }

      .profile-avatar::after {
        content: "";
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 12px;
        height: 12px;
        background: #28c76f;
        border: 2px solid white;
        border-radius: 50%;
      }

      .profile-info h4 {
        color: #566a7f;
        font-size: 16px;
      }

      .profile-info p {
        margin-top: 4px;
        color: #a1acb8;
        font-size: 14px;
      }

      .profile-menu-content {
        padding: 12px;
      }

      .profile-menu button {
        width: 100%;
        border: none;
        background: transparent;
        color: #566a7f;
        padding: 14px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        transition: 0.3s;
      }

      .profile-menu button:hover {
        background: #f5f5f9;
        color: #ea5455;
      }

      /* ================= CONTENT ================= */

      .content-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
      }

      .content-header {
        margin-bottom: 25px;
      }

      .content-header h1 {
        font-size: 30px;
        color: #566a7f;
        margin-bottom: 10px;
      }

      .content-header p {
        color: #a1acb8;
      }

      /* ================= FILTER ================= */

      .filter-box {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 25px;
      }

      .input-group {
        flex: 1;
        min-width: 220px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .input-box {
        position: relative;
      }

      .input-box i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #a1acb8;
      }

      .input-box input {
        width: 100%;
        padding: 14px 14px 14px 45px;
        border: 1px solid #d9dee3;
        border-radius: 12px;
        outline: none;
        font-size: 14px;
      }

      .input-box input:focus {
        border-color: #696cff;
        box-shadow: 0 0 0 3px rgba(105, 108, 255, 0.15);
      }

      .btn {
        border: none;
        padding: 14px 20px;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-search {
        background: #696cff;
        margin-top: 30px;
      }

      /* ================= SUMMARY ================= */

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 25px;
      }

      .summary-card {
        background: #f8f8fc;
        border-radius: 16px;
        padding: 20px;
      }

      .summary-card h4 {
        color: #a1acb8;
        margin-bottom: 10px;
      }

      .summary-card h2 {
        color: #566a7f;
      }

      /* ================= TABLE ================= */

      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
      }

      th {
        background: #696cff;
        color: white;
        padding: 15px;
        text-align: left;
        font-size: 14px;
      }

      td {
        padding: 15px;
        border-bottom: 1px solid #ebeef0;
        font-size: 14px;
      }

      tr:hover {
        background: #f8f8fc;
      }

      .action-btn {
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        margin-right: 5px;
        margin-bottom: 5px;
        font-size: 13px;
      }

      .view {
        background: #696cff;
      }

      .hapus {
        background: #ea5455;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 900px) {
        .sidebar {
          left: -270px;
        }

        .main {
          margin-left: 0;
          width: 100%;
          padding: 15px;
        }

        .hamburger {
          display: flex;
        }

        .filter-box {
          flex-direction: column;
        }

        .btn-search {
          width: 100%;
          margin-top: 0;
        }

        .content-card {
          padding: 20px;
        }

        .content-header h1 {
          font-size: 24px;
        }
      }

      @media (max-width: 600px) {
        .topbar {
          padding: 12px 15px;
        }

        .content-card {
          padding: 15px;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }

        th,
        td {
          padding: 12px;
          font-size: 13px;
        }

        .action-btn {
          width: 100%;
        }
      }
    </style>

    <script>
      cekLogin();
    </script>
  </head>

  <body>
    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="logo.png" alt="Logo" />
        <h3>Laporan Atensi Harian</h3>
      </div>

      <div class="menu">
        <a href="dashboard.html">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <div class="menu-title">Management</div>

        <a href="index.html">
          <i class="fa-solid fa-file-pen"></i>
          Buat Laporan
        </a>

        <!-- MENU ADMIN -->
        <div id="adminMenu">
          <a href="user.html">
            <i class="fa-solid fa-users"></i>
            Manajemen User
          </a>

          <a href="laporan.html" class="active">
            <i class="fa-solid fa-chart-column"></i>
            Manajemen Laporan
          </a>

          <a href="tambah-user.html">
            <i class="fa-solid fa-user-plus"></i>
            Tambah User
          </a>
        </div>

        <!-- MENU USER -->
        <div id="userMenu">
          <a href="laporan.html" class="active">
            <i class="fa-solid fa-chart-column"></i>
            Manajemen Laporan
          </a>
        </div>

        <div class="menu-title">System</div>

        <a href="#" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <!-- TOPBAR -->
      <div class="topbar">
        <div class="top-left">
          <button class="hamburger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>

        <div style="position: relative">
          <div class="avatar" id="avatarUser" onclick="toggleProfileMenu()">
            A
          </div>

          <div class="profile-menu" id="profileMenu">
            <div class="profile-header">
              <div class="profile-avatar" id="profileAvatar">A</div>

              <div class="profile-info">
                <h4 id="profileName">Admin</h4>
                <p id="profileRole">Administrator</p>
              </div>
            </div>

            <div class="profile-menu-content">
              <button onclick="logout()">
                <i class="fa-solid fa-power-off"></i>
                Log Out
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="content-card">
        <div class="content-header">
          <h1>Manajemen Laporan</h1>
          <p>Kelola seluruh data laporan atensi harian.</p>
        </div>

        <!-- FILTER -->
        <div class="filter-box">
          <div class="input-group">
            <label>Dari Tanggal</label>

            <div class="input-box">
              <i class="fa-solid fa-calendar"></i>
              <input type="date" id="dari" />
            </div>
          </div>

          <div class="input-group">
            <label>Sampai Tanggal</label>

            <div class="input-box">
              <i class="fa-solid fa-calendar"></i>
              <input type="date" id="sampai" />
            </div>
          </div>

          <button class="btn btn-search" onclick="loadLaporan()">
            <i class="fa-solid fa-magnifying-glass"></i>
            Cari Data
          </button>
        </div>

        <!-- SUMMARY -->
        <div class="summary-grid">
          <div class="summary-card">
            <h4>Total Laporan</h4>
            <h2 id="totalLaporan">0</h2>
          </div>

          <div class="summary-card">
            <h4>Total Postingan</h4>
            <h2 id="totalPostingan">0</h2>
          </div>
        </div>

        <!-- TABLE -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>User</th>
                <th>Jumlah Postingan</th>
                <th>Aksi</th>
              </tr>
            </thead>

            <tbody id="tabelLaporan"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      // ================= SIDEBAR =================

      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
      }

      // ================= USER PROFILE =================

      const namaUser = localStorage.getItem("nama") || "Admin";
      const roleUser = localStorage.getItem("role") || "admin";

      const inisial = namaUser.charAt(0).toUpperCase();

      document.getElementById("avatarUser").innerText = inisial;
      document.getElementById("profileAvatar").innerText = inisial;
      document.getElementById("profileName").innerText = namaUser;
      document.getElementById("profileRole").innerText = roleUser;

      function toggleProfileMenu() {
        document.getElementById("profileMenu").classList.toggle("active");
      }

      window.addEventListener("click", function (e) {
        const avatar = document.getElementById("avatarUser");
        const menu = document.getElementById("profileMenu");

        if (!avatar.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove("active");
        }
      });

      // ================= LOAD LAPORAN =================

      function loadLaporan() {
        const dari = document.getElementById("dari").value;
        const sampai = document.getElementById("sampai").value;

        let url = "/api/laporan";

        if (dari && sampai) {
          url += `?dari=${dari}&sampai=${sampai}`;
        }

        fetch(url, {
          headers: {
            Authorization: localStorage.getItem("token"),
          },
        })
          .then((res) => res.json())
          .then((data) => {
            let html = "";

            let totalLaporan = data.length;
            let totalPostingan = 0;

            data.forEach((l) => {
              totalPostingan += Number(l.jumlah_postingan || 0);

              html += `
                <tr>
                  <td>${formatTanggalIndo(l.tanggal)}</td>
                  <td>${l.nama}</td>
                  <td>${l.jumlah_postingan}</td>

                  <td>
                    <button
                      class="action-btn view"
                      onclick="viewLaporan(${l.id})"
                    >
                      <i class="fa-solid fa-eye"></i>
                      View
                    </button>

                    ${
                      roleUser === "admin"
                        ? `
                      <button
                        class="action-btn hapus"
                        onclick="hapusLaporan(${l.id})"
                      >
                        <i class="fa-solid fa-trash"></i>
                        Hapus
                      </button>
                    `
                        : ""
                    }
                  </td>
                </tr>
              `;
            });

            document.getElementById("tabelLaporan").innerHTML = html;

            document.getElementById("totalLaporan").innerText = totalLaporan;

            document.getElementById("totalPostingan").innerText =
              totalPostingan;
          });
      }

      // ================= DELETE =================

      function hapusLaporan(id) {
        if (roleUser !== "admin") {
          Swal.fire(
            "Akses Ditolak",
            "Hanya admin yang dapat menghapus laporan",
            "error",
          );
          return;
        }

        Swal.fire({
          title: "Yakin hapus?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Ya",
        }).then((result) => {
          if (result.isConfirmed) {
            fetch(`/api/laporan/${id}`, {
              method: "DELETE",
              headers: {
                Authorization: localStorage.getItem("token"),
              },
            })
              .then((res) => res.json())
              .then((data) => {
                Swal.fire("Berhasil", data.message, "success");
                loadLaporan();
              });
          }
        });
      }

      // ================= FORMAT TANGGAL =================

      function formatTanggalIndo(tgl) {
        const hari = [
          "Minggu",
          "Senin",
          "Selasa",
          "Rabu",
          "Kamis",
          "Jumat",
          "Sabtu",
        ];

        const bulan = [
          "Januari",
          "Februari",
          "Maret",
          "April",
          "Mei",
          "Juni",
          "Juli",
          "Agustus",
          "September",
          "Oktober",
          "November",
          "Desember",
        ];

        const d = new Date(tgl);

        return `${hari[d.getDay()]}, ${d.getDate()} ${
          bulan[d.getMonth()]
        } ${d.getFullYear()}`;
      }

      // ================= VIEW LAPORAN =================

      function viewLaporan(id) {
        fetch(`/api/laporan/${id}`, {
          headers: {
            Authorization: localStorage.getItem("token"),
          },
        })
          .then((res) => res.json())
          .then((data) => {
            let uraian = "";

            Object.values(data.postingan).forEach((p, i) => {
              uraian += `${i + 1}. Konten Informatif "${p.judul}"\n\n`;

              p.platform.forEach((pl) => {
                let label = pl.jenis;

                if (pl.jenis === "ig") label = "Instagram";
                else if (pl.jenis === "fb") label = "Facebook";
                else if (pl.jenis === "x") label = "X / Twitter";
                else if (pl.jenis === "tt") label = "TikTok";

                uraian += `${label} : ${pl.link}\n\n`;
              });
            });

            const tanggalFormat = formatTanggalIndo(data.tanggal);

            const laporan = `
LAPORAN ATENSI PIMPINAN

Assalamu’alaikum Wr. Wb. Kepada Yth :
1. Plt. Direktur Jenderal Imigrasi;
2. Sekretaris Direktorat Jenderal Imigrasi;
3. Para Direktur di lingkungan Direktorat Jenderal Imigrasi;
4. Kepala Kantor Wilayah Direktorat Jenderal Imigrasi Kalimantan Barat;

I. KEGIATAN
Kegiatan Kinerja Harian, ${tanggalFormat}

II. WAKTU DAN TEMPAT
Waktu  : ${tanggalFormat}
Pukul  : 14.00 - 15.00 WIB
Tempat : Kanim Sambas

III. URAIAN KEGIATAN
${uraian}Demikian Laporan Kegiatan ini kami sampaikan.

Salam Hormat
Kepala Kantor Imigrasi Kelas II TPI Sambas
`;

            Swal.fire({
              title: "📄 Laporan Lengkap",
              width: 900,

              html: `
                <textarea
                  id="laporanText"
                  style="
                    width:100%;
                    height:400px;
                    border:1px solid #d9dee3;
                    border-radius:12px;
                    padding:15px;
                    outline:none;
                    resize:none;
                    font-family:monospace;
                    white-space:pre;
                  "
                >${laporan}</textarea>
              `,

              confirmButtonText: "Tutup",
            });
          });
      }

      // ================= INIT =================

      loadLaporan();

      function aturMenuByRole() {
        const role = localStorage.getItem("role");

        if (role !== "admin") {
          document.getElementById("adminMenu").style.display = "none";
        } else {
          document.getElementById("userMenu").style.display = "none";
        }
      }

      aturMenuByRole();
    </script>
  </body>
</html>
