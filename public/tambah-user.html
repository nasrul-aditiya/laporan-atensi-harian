<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tambah User</title>

    <!-- SweetAlert -->
    <link rel="stylesheet" href="sweetalert2.min.css" />
    <script src="sweetalert2.min.js"></script>

    <script src="auth.js"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f9;
        display: flex;
        color: #566a7f;
      }

      /* ================= SIDEBAR ================= */

      .sidebar {
        width: 260px;
        height: 100vh;
        background: white;
        padding: 20px;
        position: fixed;
        left: 0;
        top: 0;
        border-right: 1px solid #ebeef0;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .logo img {
        width: 45px;
        height: 45px;
        object-fit: contain;
      }

      .logo h3 {
        font-size: 22px;
        color: #566a7f;
      }

      .menu-title {
        font-size: 12px;
        color: #a1acb8;
        margin: 25px 0 10px;
        text-transform: uppercase;
      }

      .menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        text-decoration: none;
        color: #697a8d;
        border-radius: 12px;
        margin-bottom: 8px;
        transition: 0.3s;
      }

      .menu a:hover,
      .menu a.active {
        background: rgba(105, 108, 255, 0.16);
        color: #696cff;
      }

      /* ================= MAIN ================= */

      .main {
        margin-left: 260px;
        width: calc(100% - 260px);
        padding: 20px;
      }

      /* ================= TOPBAR ================= */

      .topbar {
        background: white;
        border-radius: 16px;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
      }

      .top-icons {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 18px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
      }

      /* ================= PROFILE MENU ================= */

      .profile-menu {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        width: 240px;
        overflow: hidden;
        display: none;
        z-index: 999;
        border: 1px solid #ebeef0;
      }

      .profile-menu.active {
        display: block;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        border-bottom: 1px solid #ebeef0;
      }

      .profile-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        position: relative;
      }

      .profile-avatar::after {
        content: "";
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 12px;
        height: 12px;
        background: #28c76f;
        border: 2px solid white;
        border-radius: 50%;
      }

      .profile-info h4 {
        color: #566a7f;
        font-size: 16px;
      }

      .profile-info p {
        margin-top: 4px;
        color: #a1acb8;
        font-size: 14px;
      }

      .profile-menu-content {
        padding: 12px;
      }

      .profile-menu button {
        width: 100%;
        border: none;
        background: transparent;
        color: #566a7f;
        padding: 14px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        transition: 0.3s;
      }

      .profile-menu button:hover {
        background: #f5f5f9;
        color: #ea5455;
      }

      /* ================= FORM ================= */

      .form-card {
        margin-top: 25px;
        background: white;
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
        max-width: 700px;
      }

      .form-header {
        margin-bottom: 30px;
      }

      .form-header h1 {
        font-size: 30px;
        color: #566a7f;
        margin-bottom: 10px;
      }

      .form-header p {
        color: #a1acb8;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #566a7f;
      }

      .input-box {
        position: relative;
      }

      .input-box i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #a1acb8;
      }

      .input-box input,
      .input-box select {
        width: 100%;
        padding: 14px 14px 14px 45px;
        border: 1px solid #d9dee3;
        border-radius: 12px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
        background: white;
      }

      .input-box input:focus,
      .input-box select:focus {
        border-color: #696cff;
        box-shadow: 0 0 0 3px rgba(105, 108, 255, 0.15);
      }

      /* ================= BUTTON ================= */

      .btn-group {
        margin-top: 30px;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }

      .btn {
        border: none;
        padding: 14px 20px;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-save {
        background: #28c76f;
      }

      .btn-back {
        background: #696cff;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 900px) {
        .sidebar {
          display: none;
        }

        .main {
          margin-left: 0;
          width: 100%;
        }

        .form-card {
          max-width: 100%;
        }
      }
    </style>

    <script>
      cekLogin();

      if (localStorage.getItem("role") !== "admin") {
        Swal.fire({
          icon: "error",
          title: "Akses ditolak",
          text: "Halaman ini hanya untuk admin",
        }).then(() => {
          window.location.href = "index.html";
        });
      }
    </script>
  </head>

  <body>
    <!-- ================= SIDEBAR ================= -->

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png" alt="Logo" />

        <h3>Laporan Atensi Harian</h3>
      </div>

      <div class="menu">
        <a href="dashboard.html">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <div class="menu-title">Management</div>

        <a href="index.html">
          <i class="fa-solid fa-file-pen"></i>
          Buat Laporan
        </a>

        <!-- MENU KHUSUS ADMIN -->
        <div id="adminMenu">
          <a href="user.html">
            <i class="fa-solid fa-users"></i>
            Manajemen User
          </a>

          <a href="laporan.html">
            <i class="fa-solid fa-chart-column"></i>
            Manajemen Laporan
          </a>

          <a href="tambah-user.html" class="active">
            <i class="fa-solid fa-user-plus"></i>
            Tambah User
          </a>
        </div>

        <!-- MENU USER BIASA -->
        <div id="userMenu">
          <a href="laporan.html">
            <i class="fa-solid fa-chart-column"></i>
            Manajemen Laporan
          </a>
        </div>

        <div class="menu-title">System</div>

        <a href="#" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->

    <main class="main">
      <!-- ================= TOPBAR ================= -->

      <div class="topbar">
        <div></div>

        <div class="top-icons">
          <div style="position: relative">
            <div class="avatar" id="avatarUser" onclick="toggleProfileMenu()">
              A
            </div>

            <div class="profile-menu" id="profileMenu">
              <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">A</div>

                <div class="profile-info">
                  <h4 id="profileName">Admin</h4>
                  <p id="profileRole">Administrator</p>
                </div>
              </div>

              <div class="profile-menu-content">
                <button onclick="logout()">
                  <i class="fa-solid fa-power-off"></i>
                  Log Out
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= FORM ================= -->

      <div class="form-card">
        <div class="form-header">
          <h1>Tambah User</h1>
          <p>Tambahkan data user baru ke dalam sistem.</p>
        </div>

        <div class="form-group">
          <label>Nama</label>

          <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="nama" placeholder="Masukkan nama" />
          </div>
        </div>

        <div class="form-group">
          <label>Jabatan</label>

          <div class="input-box">
            <i class="fa-solid fa-briefcase"></i>
            <input type="text" id="jabatan" placeholder="Masukkan jabatan" />
          </div>
        </div>

        <div class="form-group">
          <label>Username</label>

          <div class="input-box">
            <i class="fa-solid fa-at"></i>
            <input type="text" id="username" placeholder="Masukkan username" />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>

          <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Role</label>

          <div class="input-box">
            <i class="fa-solid fa-user-shield"></i>

            <select id="role">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-save" onclick="tambahUser()">
            <i class="fa-solid fa-floppy-disk"></i>
            Simpan
          </button>

          <button
            class="btn btn-back"
            onclick="window.location.href = 'dashboard.html'"
          >
            <i class="fa-solid fa-arrow-left"></i>
            Kembali
          </button>
        </div>
      </div>
    </main>

    <script>
      // ================= USER PROFILE =================

      const namaUser = localStorage.getItem("nama") || "Admin";
      const roleUser = localStorage.getItem("role") || "admin";

      const inisial = namaUser.charAt(0).toUpperCase();

      document.getElementById("avatarUser").innerText = inisial;
      document.getElementById("profileAvatar").innerText = inisial;
      document.getElementById("profileName").innerText = namaUser;
      document.getElementById("profileRole").innerText = roleUser;

      function toggleProfileMenu() {
        document.getElementById("profileMenu").classList.toggle("active");
      }

      window.addEventListener("click", function (e) {
        const avatar = document.getElementById("avatarUser");
        const menu = document.getElementById("profileMenu");

        if (!avatar.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove("active");
        }
      });

      // ================= TAMBAH USER =================

      function tambahUser() {
        const nama = document.getElementById("nama").value.trim();
        const jabatan = document.getElementById("jabatan").value.trim();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const role = document.getElementById("role").value;

        // VALIDASI

        if (!nama || !username || !password) {
          Swal.fire({
            icon: "warning",
            title: "Data belum lengkap",
            text: "Nama, Username, dan Password wajib diisi",
          });

          return;
        }

        // LOADING

        Swal.fire({
          title: "Menyimpan...",
          text: "Mohon tunggu",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        fetch("/api/user", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            Authorization: localStorage.getItem("token"),
          },

          body: JSON.stringify({
            nama,
            jabatan,
            username,
            password,
            role,
          }),
        })
          .then((res) => res.json())

          .then((data) => {
            Swal.fire({
              icon: "success",
              title: "Berhasil",
              text: data.message,
              timer: 1500,
              showConfirmButton: false,
            });

            document.getElementById("nama").value = "";
            document.getElementById("jabatan").value = "";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            document.getElementById("role").value = "user";

            document.getElementById("nama").focus();
          })

          .catch(() => {
            Swal.fire({
              icon: "error",
              title: "Gagal",
              text: "Gagal tambah user",
            });
          });
      }

      function aturMenuByRole() {
        const role = localStorage.getItem("role");

        // jika bukan admin
        if (role !== "admin") {
          document.getElementById("adminMenu").style.display = "none";
        } else {
          document.getElementById("userMenu").style.display = "none";
        }
      }

      aturMenuByRole();
    </script>
  </body>
</html>
