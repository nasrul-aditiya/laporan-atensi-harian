<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manajemen User</title>

    <script src="auth.js"></script>

    <link rel="stylesheet" href="sweetalert2.min.css" />
    <script src="sweetalert2.min.js"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f9;
        color: #566a7f;
        overflow-x: hidden;
      }

      /* ================= OVERLAY ================= */

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1400;
        display: none;
      }

      .overlay.active {
        display: block;
      }

      /* ================= SIDEBAR ================= */

      .sidebar {
        width: 260px;
        height: 100vh;
        background: white;
        padding: 20px;
        position: fixed;
        left: 0;
        top: 0;
        border-right: 1px solid #ebeef0;
        overflow-y: auto;
        transition: 0.3s;
        z-index: 1500;
      }

      .sidebar.active {
        left: 0;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .logo img {
        width: 45px;
        height: 45px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .logo h3 {
        color: #566a7f;
        font-size: 22px;
      }

      .menu-title {
        font-size: 12px;
        color: #a1acb8;
        margin: 25px 0 10px;
        text-transform: uppercase;
      }

      .menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        text-decoration: none;
        color: #697a8d;
        border-radius: 12px;
        margin-bottom: 8px;
        transition: 0.3s;
      }

      .menu a:hover,
      .menu a.active {
        background: rgba(105, 108, 255, 0.16);
        color: #696cff;
      }

      /* ================= MAIN ================= */

      .main {
        margin-left: 260px;
        width: calc(100% - 260px);
        padding: 20px;
        transition: 0.3s;
      }

      /* ================= TOPBAR ================= */

      .topbar {
        background: white;
        border-radius: 16px;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
        margin-bottom: 25px;
      }

      .top-left {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .hamburger {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 12px;
        background: #f5f5f9;
        color: #566a7f;
        cursor: pointer;
        font-size: 18px;
        display: none;
      }

      .page-title {
        font-size: 20px;
        font-weight: bold;
        color: #566a7f;
      }

      .top-icons {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 18px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
      }

      /* ================= PROFILE MENU ================= */

      .profile-menu {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        width: 240px;
        overflow: hidden;
        display: none;
        z-index: 999;
        border: 1px solid #ebeef0;
      }

      .profile-menu.active {
        display: block;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        border-bottom: 1px solid #ebeef0;
      }

      .profile-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #696cff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        position: relative;
      }

      .profile-avatar::after {
        content: "";
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 12px;
        height: 12px;
        background: #28c76f;
        border: 2px solid white;
        border-radius: 50%;
      }

      .profile-info h4 {
        color: #566a7f;
        font-size: 16px;
      }

      .profile-info p {
        margin-top: 4px;
        color: #a1acb8;
        font-size: 14px;
      }

      .profile-menu-content {
        padding: 12px;
      }

      .profile-menu button {
        width: 100%;
        border: none;
        background: transparent;
        color: #566a7f;
        padding: 14px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        transition: 0.3s;
      }

      .profile-menu button:hover {
        background: #f5f5f9;
        color: #ea5455;
      }

      /* ================= CONTENT ================= */

      .content-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 2px 10px rgba(67, 89, 113, 0.08);
      }

      .content-header {
        margin-bottom: 25px;
      }

      .content-header h1 {
        font-size: 30px;
        color: #566a7f;
        margin-bottom: 10px;
      }

      .content-header p {
        color: #a1acb8;
      }

      /* ================= TABLE ================= */

      .table-card {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
      }

      th {
        text-align: left;
        padding: 16px;
        background: #f5f5f9;
        color: #566a7f;
        font-size: 14px;
        white-space: nowrap;
      }

      td {
        padding: 16px;
        border-bottom: 1px solid #ebeef0;
        color: #697a8d;
      }

      tr:hover {
        background: #f9f9fb;
      }

      /* ================= BADGE ================= */

      .badge {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }

      .badge-admin {
        background: rgba(105, 108, 255, 0.15);
        color: #696cff;
      }

      .badge-user {
        background: rgba(40, 199, 111, 0.15);
        color: #28c76f;
      }

      /* ================= BUTTON ================= */

      .action-btn {
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        margin-right: 8px;
        transition: 0.3s;
      }

      .action-btn:hover {
        transform: translateY(-2px);
      }

      .edit {
        background: #ff9f43;
      }

      .hapus {
        background: #ea5455;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 900px) {
        .hamburger {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .sidebar {
          left: -280px;
        }

        .sidebar.active {
          left: 0;
        }

        .main {
          margin-left: 0;
          width: 100%;
          padding: 15px;
        }

        .content-card {
          padding: 20px;
        }

        .content-header h1 {
          font-size: 26px;
        }
      }

      @media (max-width: 600px) {
        .topbar {
          padding: 14px;
        }

        .page-title {
          font-size: 18px;
        }

        .content-card {
          padding: 18px 15px;
          border-radius: 18px;
        }

        .content-header h1 {
          font-size: 22px;
        }

        .content-header p {
          font-size: 14px;
        }

        th,
        td {
          padding: 12px;
          font-size: 13px;
        }

        .action-btn {
          padding: 8px 10px;
          margin-bottom: 5px;
        }

        .logo h3 {
          font-size: 18px;
        }
      }
    </style>

    <script>
      cekLogin();

      if (localStorage.getItem("role") !== "admin") {
        Swal.fire({
          icon: "error",
          title: "Akses ditolak",
        }).then(() => {
          window.location.href = "index.html";
        });
      }
    </script>
  </head>

  <body>
    <!-- OVERLAY -->

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img src="logo.png" alt="Logo" />

        <h3>Laporan Atensi Harian</h3>
      </div>

      <div class="menu">
        <a href="dashboard.html">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <div class="menu-title">Management</div>

        <a href="index.html">
          <i class="fa-solid fa-file-pen"></i>
          Buat Laporan
        </a>

        <!-- MENU KHUSUS ADMIN -->

        <div id="adminMenu">
          <a href="user.html" class="active">
            <i class="fa-solid fa-users"></i>
            Manajemen User
          </a>

          <a href="laporan.html">
            <i class="fa-solid fa-chart-column"></i>
            Manajemen Laporan
          </a>

          <a href="tambah-user.html">
            <i class="fa-solid fa-user-plus"></i>
            Tambah User
          </a>
        </div>

        <!-- MENU USER -->

        <div id="userMenu">
          <a href="laporan.html">
            <i class="fa-solid fa-chart-column"></i>
            Manajemen Laporan
          </a>
        </div>

        <div class="menu-title">System</div>

        <a href="#" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </div>
    </aside>

    <!-- MAIN -->

    <main class="main">
      <!-- TOPBAR -->

      <div class="topbar">
        <div class="top-left">
          <button class="hamburger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>

        <div class="top-icons">
          <div style="position: relative">
            <div class="avatar" id="avatarUser" onclick="toggleProfileMenu()">
              A
            </div>

            <div class="profile-menu" id="profileMenu">
              <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">A</div>

                <div class="profile-info">
                  <h4 id="profileName">Admin</h4>
                  <p id="profileRole">Administrator</p>
                </div>
              </div>

              <div class="profile-menu-content">
                <button onclick="logout()">
                  <i class="fa-solid fa-power-off"></i>
                  Log Out
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- CONTENT -->

      <div class="content-card">
        <div class="content-header">
          <h1>Manajemen User</h1>
          <p>Kelola seluruh data user pada sistem.</p>
        </div>

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Jabatan</th>
                <th>Username</th>
                <th>Role</th>
                <th>Aksi</th>
              </tr>
            </thead>

            <tbody id="tabelUser"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      // ================= SIDEBAR =================

      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");

        document.getElementById("overlay").classList.toggle("active");
      }

      // ================= PROFILE =================

      const namaUser = localStorage.getItem("nama") || "Admin";

      const roleUser = localStorage.getItem("role") || "admin";

      const inisial = namaUser.charAt(0).toUpperCase();

      document.getElementById("avatarUser").innerText = inisial;

      document.getElementById("profileAvatar").innerText = inisial;

      document.getElementById("profileName").innerText = namaUser;

      document.getElementById("profileRole").innerText = roleUser;

      function toggleProfileMenu() {
        document.getElementById("profileMenu").classList.toggle("active");
      }

      window.addEventListener("click", function (e) {
        const avatar = document.getElementById("avatarUser");

        const menu = document.getElementById("profileMenu");

        if (!avatar.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove("active");
        }
      });

      // ================= LOAD USER =================

      function loadUser() {
        fetch("/api/user", {
          headers: {
            Authorization: localStorage.getItem("token"),
          },
        })
          .then((res) => res.json())

          .then((data) => {
            let html = "";

            data.forEach((u) => {
              html += `
                <tr>
                  <td>${u.nama}</td>

                  <td>${u.jabatan}</td>

                  <td>${u.username}</td>

                  <td>
                    <span class="badge ${
                      u.role === "admin" ? "badge-admin" : "badge-user"
                    }">
                      ${u.role}
                    </span>
                  </td>

                  <td>

                    <button
                      class="action-btn edit"
                      onclick="editUser(
                        ${u.id},
                        '${u.nama}',
                        '${u.jabatan}',
                        '${u.username}',
                        '${u.role}'
                      )"
                    >
                      <i class="fa-solid fa-pen"></i>
                    </button>

                    <button
                      class="action-btn hapus"
                      onclick="hapusUser(${u.id})"
                    >
                      <i class="fa-solid fa-trash"></i>
                    </button>

                  </td>
                </tr>
              `;
            });

            document.getElementById("tabelUser").innerHTML = html;
          });
      }

      // ================= DELETE =================

      function hapusUser(id) {
        Swal.fire({
          title: "Yakin hapus user?",
          text: "Data user akan dihapus permanen",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#ea5455",
          confirmButtonText: "Ya, Hapus",
          cancelButtonText: "Batal",
        }).then((result) => {
          if (result.isConfirmed) {
            fetch(`/api/user/${id}`, {
              method: "DELETE",

              headers: {
                Authorization: localStorage.getItem("token"),
              },
            })
              .then((res) => res.json())

              .then((data) => {
                Swal.fire({
                  icon: "success",
                  title: "Berhasil",
                  text: data.message,
                });

                loadUser();
              });
          }
        });
      }

      // ================= EDIT =================

      function editUser(id, nama, jabatan, username, role) {
        Swal.fire({
          title: "Edit User",

          width: 500,

          html: `
            <style>

              .form-row{
                display:flex;
                flex-direction:column;
                text-align:left;
                margin-bottom:15px;
              }

              .form-row label{
                margin-bottom:8px;
                font-weight:600;
                color:#566a7f;
              }

              .form-row input,
              .form-row select{
                padding:12px;
                border:1px solid #d9dee3;
                border-radius:10px;
                outline:none;
              }

            </style>

            <div>

              <div class="form-row">
                <label>Nama</label>
                <input id="swal_nama" value="${nama}">
              </div>

              <div class="form-row">
                <label>Jabatan</label>
                <input id="swal_jabatan" value="${jabatan}">
              </div>

              <div class="form-row">
                <label>Username</label>
                <input id="swal_username" value="${username}">
              </div>

              <div class="form-row">
                <label>Role</label>

                <select id="swal_role">

                  <option value="user"
                    ${role == "user" ? "selected" : ""}
                  >
                    User
                  </option>

                  <option value="admin"
                    ${role == "admin" ? "selected" : ""}
                  >
                    Admin
                  </option>

                </select>
              </div>

            </div>
          `,

          showCancelButton: true,
          confirmButtonColor: "#696cff",
          confirmButtonText: "Simpan",
          cancelButtonText: "Batal",

          preConfirm: () => {
            return {
              nama: document.getElementById("swal_nama").value,
              jabatan: document.getElementById("swal_jabatan").value,
              username: document.getElementById("swal_username").value,
              role: document.getElementById("swal_role").value,
            };
          },
        }).then((result) => {
          if (result.isConfirmed) {
            fetch(`/api/user/${id}`, {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
                Authorization: localStorage.getItem("token"),
              },

              body: JSON.stringify(result.value),
            })
              .then((res) => res.json())

              .then((data) => {
                Swal.fire({
                  icon: "success",
                  title: "Berhasil",
                  text: data.message,
                });

                loadUser();
              });
          }
        });
      }

      // ================= MENU ROLE =================

      function aturMenuByRole() {
        const role = localStorage.getItem("role");

        if (role !== "admin") {
          document.getElementById("adminMenu").style.display = "none";
        } else {
          document.getElementById("userMenu").style.display = "none";
        }
      }

      aturMenuByRole();

      loadUser();
    </script>
  </body>
</html>
